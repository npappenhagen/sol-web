heading: "Meet Laurel"
subheading: "Photographer, mother, lover of golden hour."
bio: "For me, there is nothing sweeter than a camera in hand, surrounded by nature, capturing love and connection in its most honest form. I photograph weddings and elopements, families and growing bellies, retreats and the creatives building something true. It all lives in the same place: real people, present and embodied, witnessed with care. I move quietly. I observe before I capture. No heavy posing, no forced direction. Just you, the wild beauty of this country, and what's actually happening between the people you love. Based in Guanacaste, usually sandy, always chasing the light."
